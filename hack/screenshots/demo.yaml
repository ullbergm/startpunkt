---
# Scaled-to-zero workloads satisfy their desired readiness without starting
# demonstration containers. No image is pulled by the screenshot cluster.
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: monitoring}
spec:
  selector: {app: grafana}
  ports: [{port: 80, targetPort: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: monitoring}
spec:
  replicas: 0
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers: [{name: demo, image: registry.k8s.io/pause:3.10}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nas, namespace: startpunkt}
spec:
  replicas: 0
  selector: {matchLabels: {app: nas}}
  template:
    metadata: {labels: {app: nas}}
    spec:
      containers: [{name: demo, image: registry.k8s.io/pause:3.10}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backup, namespace: startpunkt}
spec:
  replicas: 0
  selector: {matchLabels: {app: backup}}
  template:
    metadata: {labels: {app: backup}}
    spec:
      containers: [{name: demo, image: registry.k8s.io/pause:3.10}]
