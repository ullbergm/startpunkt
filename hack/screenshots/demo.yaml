apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  annotations:
    startpunkt.ullberg.us/enable: "true"
    startpunkt.ullberg.us/appName: Jellyfin
    startpunkt.ullberg.us/group: Media
    startpunkt.ullberg.us/icon: simple-icons:jellyfin
    startpunkt.ullberg.us/iconColor: "#aa5cc3"
    startpunkt.ullberg.us/info: Movies, series and music
    startpunkt.ullberg.us/location: "10"
spec:
  tls: [{hosts: [jellyfin.example.com]}]
  rules: [{host: jellyfin.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: jellyfin, port: {number: 80}}}}]}}]
