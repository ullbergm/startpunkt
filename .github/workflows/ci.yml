name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: The generated definitions are up to date
        run: |
          make crds
          git diff --exit-code -- charts/startpunkt/crds charts/startpunkt/files/crds

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results
          retention-days: 7

  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check-chart-schemas
      - run: helm lint charts/startpunkt
      - run: helm lint charts/startpunkt --set mode=split --set route.enabled=true --set route.host=start.example.com
      - run: helm lint charts/startpunkt --set customResources.enabled=false --set crds.install=false

  image:
    name: Image
    runs-on: ubuntu-latest
    # Only a push to main builds the image. It is published with the tag
    # "main", once the other jobs have passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ullbergm/startpunkt'
    needs: [backend, frontend, chart]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        run: echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # The Dockerfile cross-compiles on the build platform, so no emulation
      # is needed for the second architecture.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
