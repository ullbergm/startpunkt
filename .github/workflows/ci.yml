name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: The generated definitions are up to date
        run: |
          make crds
          git diff --exit-code -- charts/startpunkt/crds charts/startpunkt/files/crds

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: helm lint charts/startpunkt
      - run: helm lint charts/startpunkt --set mode=split --set route.enabled=true --set route.host=start.example.com
      - run: helm lint charts/startpunkt --set customResources.enabled=false --set crds.install=false

  cutover:
    name: Move from 4.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The 4.x chart is read from its tag.
          fetch-depth: 0
      - run: hack/test-cutover.sh
