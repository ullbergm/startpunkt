name: Release

# Every push to main updates the release pull request, which holds the
# changelog and the next version. Merging that pull request creates the tag
# and the GitHub release, and this same run then publishes the image and the
# chart. A tag made with the workflow's own token does not start another
# workflow, which is why publishing is not a workflow of its own.
#
# A tag pushed by hand is published too. That is the way to make a
# pre-release: a tag with a suffix, like v5.1.0-rc.1, does not move the
# "latest" and major tags.
on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release-please:
    name: Release pull request
    if: github.repository == 'ullbergm/startpunkt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish
    needs: release-please
    # The job above is skipped for a tag pushed by hand, so its result is not
    # required, only that it did not fail.
    if: >-
      !cancelled() && !failure() &&
      github.repository == 'ullbergm/startpunkt' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Checks
        run: |
          go vet ./...
          go test -race ./...
          (cd web && npm ci && npm run check && npm test)
          helm lint charts/startpunkt

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
          flavor: |
            latest=auto

      # The Dockerfile cross-compiles on the build platform, so no emulation
      # is needed for the second architecture.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Chart
        run: |
          helm package charts/startpunkt \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "startpunkt-${{ steps.version.outputs.version }}.tgz" "$CHARTS"

      # The release already exists when it comes from the release pull
      # request. A tag pushed by hand gets its release here.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chart="startpunkt-${{ steps.version.outputs.version }}.tgz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$chart" --clobber
          else
            prerelease=
            case "$TAG" in *-*) prerelease=--prerelease ;; esac
            gh release create "$TAG" "$chart" --generate-notes $prerelease
          fi
