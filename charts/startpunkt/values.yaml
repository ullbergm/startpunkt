# Overrides the chart name used in resource names and labels.
nameOverride: ""
# Overrides the full name that every resource name starts with. By default it
# is derived from the release name, so two releases never share a name.
fullnameOverride: ""

# How Startpunkt is deployed. Both modes run the same image.
#   single: one Deployment that watches the cluster and serves the API and the
#           page.
#   split:  three Deployments. "controller" watches the cluster and is the
#           only one with Kubernetes credentials. "api" serves the API from
#           the controller's state. "web" serves the page. The Ingress or
#           Route sends /api to "api" and everything else to "web".
mode: single

image:
  repository: ghcr.io/ullbergm/startpunkt
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

crds:
  # Install the Application and Bookmark custom resource definitions. Leave
  # this off when a 4.x release on the same cluster already provides them:
  # v5 then uses the v1alpha4 version they serve. Packaging the definitions
  # with this chart is not available yet, so true is rejected.
  install: false

# Settings of the process. Each one is passed as the environment variable
# named in its comment.
config:
  cluster:
    # STARTPUNKT_CLUSTER_NAME. Identifies this instance's tiles. It is part
    # of every tile id and must not contain slashes or whitespace.
    name: local
  web:
    # STARTPUNKT_WEB_TITLE. Title of the page.
    title: Startpunkt
    # STARTPUNKT_WEB_DEFAULTLANGUAGE. Language for a visitor who has not
    # chosen one and whose browser asks for none that is available. The
    # page ships with en-US and sv-SE.
    defaultLanguage: en-US
    # STARTPUNKT_WEB_SEARCHENGINE. Where a web search from the search box
    # goes; the query is appended.
    searchEngine: https://www.google.com/search?q=
    # STARTPUNKT_WEB_CHECKFORUPDATES. Ask GitHub a few times a day whether a
    # newer release exists, and say so in the footer of the page. The request
    # is made by the api pods and does not say which version is running.
    checkForUpdates: true
    # STARTPUNKT_WEB_GITHUBLINK. Show a corner on the page that links to the
    # project on GitHub. When an update is available the corner is shown
    # either way, in another colour and linking to the releases.
    githubLink: true
    # Colours of the light and the dark appearance, as hex values, passed as
    # STARTPUNKT_WEB_THEME_<LIGHT|DARK>_<NAME>. The names are those of 4.x,
    # so an existing theme can be copied over.
    #   bodyBgColor       page background
    #   bodyColor         group headings, icons without a colour of their own,
    #                     and other secondary text
    #   emphasisColor     headings and other prominent text
    #   textPrimaryColor  tile names
    #   textAccentColor   descriptions, focus rings and highlights
    theme:
      light:
        bodyBgColor: "#F8F6F1"
        bodyColor: "#696969"
        emphasisColor: "#000000"
        textPrimaryColor: "#4C432E"
        textAccentColor: "#AA9A73"
      dark:
        bodyBgColor: "#232530"
        bodyColor: "#696969"
        emphasisColor: "#FAB795"
        textPrimaryColor: "#FAB795"
        textAccentColor: "#E95678"
  log:
    # STARTPUNKT_LOG_LEVEL: debug, info, warn or error.
    level: info
    # STARTPUNKT_LOG_FORMAT: json or text.
    format: json

# Which namespaces resources are read from.
namespaceSelector:
  # STARTPUNKT_NAMESPACESELECTOR_ANY. Read every namespace.
  any: true
  # STARTPUNKT_NAMESPACESELECTOR_MATCHNAMES. The namespaces to read when any
  # is false.
  matchNames: []

# The resource types tiles are built from. A type that the cluster does not
# have is skipped, and picked up when it appears.
#
# onlyAnnotated limits a source to objects annotated with
# startpunkt.ullberg.us/enable: "true". With onlyAnnotated off, every object
# of the type is shown unless it is annotated with enable: "false".
#
# Each setting is passed as STARTPUNKT_SOURCES_<SOURCE>_<SETTING>, for example
# STARTPUNKT_SOURCES_INGRESS_ONLYANNOTATED. Turning a source off also removes
# its RBAC rule.
sources:
  # Application custom resources (startpunkt.ullberg.us).
  application:
    enabled: true
  # Bookmark custom resources (startpunkt.ullberg.us).
  bookmark:
    enabled: true
  # OpenShift Routes.
  route:
    enabled: true
    onlyAnnotated: true
  # Kubernetes Ingresses. One tile per host in the rules.
  ingress:
    enabled: true
    onlyAnnotated: true
    # Limit to these ingress classes. Empty means every class.
    classNames: []
    # Keep Ingresses without a class when classNames is set.
    includeUnclassified: true
  # Gateway API HTTPRoutes. One tile per hostname.
  httpRoute:
    enabled: true
    onlyAnnotated: true
    # URL scheme when the object does not set the protocol annotation: http
    # or https. The route itself does not say which one the Gateway serves.
    defaultProtocol: http
  # Istio VirtualServices. One tile per host.
  virtualService:
    enabled: true
    onlyAnnotated: true
    defaultProtocol: http

# Probing of the tiles' URLs, done by the controller from inside the cluster.
# An answer below 500, including a redirect or a 404, counts as available, and
# so does a server whose certificate cannot be verified. A 5xx answer or none
# counts as unavailable. Redirects are not followed.
# Each setting is passed as STARTPUNKT_AVAILABILITY_<SETTING>.
availability:
  enabled: true
  # Time between probes of a URL that answers.
  interval: 60s
  # Limit for a single probe.
  timeout: 5s
  # Wait after a first failure. It doubles with each further failure up to
  # maxBackoff, and a success goes back to interval.
  initialBackoff: 5s
  maxBackoff: 5m
  # Probes that may run at once.
  concurrency: 8
  # Accept any TLS certificate and go on to send the request. Without it, a
  # certificate that cannot be verified already counts as available, but the
  # request is not sent, so a 5xx answer behind such a certificate is not
  # seen.
  insecureSkipVerify: false

# Other Startpunkt instances whose tiles are shown next to this one's.
federation:
  # STARTPUNKT_FEDERATION_REMOTES, as JSON. This instance subscribes to each
  # remote; the remotes need no configuration. A remote's tiles appear under
  # the name given here, which is part of their ids: keep it unique and do
  # not change it. Headers are optional, for a remote behind an
  # authenticating proxy; they end up in the pod's environment, so put
  # secrets in extraEnv from a Secret instead.
  #   remotes:
  #     - name: prod
  #       url: https://start.prod.example.com
  remotes: []

status:
  # STARTPUNKT_STATUS_ENABLED. Write the resolved URL, the availability and
  # conditions to the status of Application resources, and grant the
  # controller patch on applications/status. Next to a 4.x installation the
  # API server drops these fields, because the 4.x definitions declare an
  # empty status; the controller notices and stops trying.
  enabled: true

# Extra environment variables for every container.
extraEnv: []

# Replicas per Deployment. "all" is used in single mode, the others in split
# mode. Every process is stateless, so more than one replica of each is safe.
replicas:
  all: 1
  controller: 1
  api: 1
  web: 1

# Resources per Deployment, keyed like replicas. Example:
#   resources:
#     all:
#       requests: {cpu: 10m, memory: 32Mi}
#       limits: {memory: 128Mi}
resources: {}

serviceAccount:
  annotations: {}

rbac:
  # Create the ClusterRole and ClusterRoleBinding that let the controller
  # read the resources tiles are built from.
  create: true
  # Additional rules for the ClusterRole. An Application's urlFrom can read
  # its URL from any object, and the controller needs get, list and watch on
  # that object's type. The enabled sources are covered already. Example:
  #   extraRules:
  #     - apiGroups: [""]
  #       resources: [configmaps]
  #       verbs: [get, list, watch]
  extraRules: []

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: startpunkt.example.com
  # Name of a TLS secret for the host. Empty means no TLS section.
  tlsSecretName: ""

# OpenShift Route. In split mode two Routes are created on the same host, one
# for /api and one for everything else.
route:
  enabled: false
  # Empty lets the router generate a host. In split mode a host is required,
  # because both Routes must share it.
  host: ""
  annotations: {}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

podAnnotations: {}
podLabels: {}

# The image runs as a non-root user and writes nothing to disk. No user id is
# set here, so OpenShift can assign one.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
