apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "startpunkt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "startpunkt.commonLabels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Only the role that watches the cluster mounts a token; see the Deployments.
automountServiceAccountToken: false
