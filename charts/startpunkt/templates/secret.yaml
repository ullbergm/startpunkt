{{- if and .Values.editing.enabled .Values.editing.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "startpunkt.fullname" . }}-edit-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "startpunkt.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ .Values.editing.key | quote }}
{{- end }}
