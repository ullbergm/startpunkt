{{- if .Values.networkPolicy.enabled }}
{{- range $role := splitList " " (include "startpunkt.roles" .) }}
{{- $ctx := dict "root" $ "role" $role }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "startpunkt.roleName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "startpunkt.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "startpunkt.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- if eq $role "controller" }}
      from:
        - podSelector:
            matchLabels:
              {{- include "startpunkt.selectorLabels" (dict "root" $ "role" "api") | nindent 14 }}
        {{- if $.Values.leaderElection.enabled }}
        - podSelector:
            matchLabels:
              {{- include "startpunkt.selectorLabels" $ctx | nindent 14 }}
        {{- end }}
        {{- with $.Values.networkPolicy.controllerIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with $.Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
