{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "startpunkt.clusterName" . }}
  labels:
    {{- include "startpunkt.commonLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - startpunkt.ullberg.us
    resources:
      - applications
      - bookmarks
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "startpunkt.clusterName" . }}
  labels:
    {{- include "startpunkt.commonLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "startpunkt.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "startpunkt.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
