{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "startpunkt.clusterName" . }}
  labels:
    {{- include "startpunkt.commonLabels" . | nindent 4 }}
rules:
  {{- $read := list "get" "list" "watch" }}
  {{- $crs := list }}
  {{- if .Values.sources.application.enabled }}{{ $crs = append $crs "applications" }}{{ end }}
  {{- if .Values.sources.bookmark.enabled }}{{ $crs = append $crs "bookmarks" }}{{ end }}
  {{- with $crs }}
  - apiGroups: [startpunkt.ullberg.us]
    resources: {{ toJson . }}
    verbs: {{ toJson $read }}
  {{- end }}
  {{- if .Values.editing.enabled }}
  # Editing from the page.
  - apiGroups: [startpunkt.ullberg.us]
    resources: [applications, bookmarks]
    verbs: [create, update, delete]
  {{- end }}
  {{- if and .Values.status.enabled .Values.sources.application.enabled }}
  - apiGroups: [startpunkt.ullberg.us]
    resources: [applications/status]
    verbs: [patch]
  {{- end }}
  {{- if .Values.sources.route.enabled }}
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- if .Values.sources.ingress.enabled }}
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- if .Values.sources.httpRoute.enabled }}
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: {{ toJson $read }}
  # Namespace labels are used by Gateway allowedRoutes selectors.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- if .Values.sources.virtualService.enabled }}
  - apiGroups: [networking.istio.io]
    resources: [virtualservices, gateways]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- if has "traefik" .Values.sources.presets }}
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- if has "contour" .Values.sources.presets }}
  - apiGroups: [projectcontour.io]
    resources: [httpproxies]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- if has "knative" .Values.sources.presets }}
  - apiGroups: [serving.knative.dev]
    resources: [services]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- if has "nginx" .Values.sources.presets }}
  - apiGroups: [k8s.nginx.org]
    resources: [virtualservers]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- if has "apisix" .Values.sources.presets }}
  - apiGroups: [apisix.apache.org]
    resources: [apisixroutes]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- range .Values.sources.custom }}
  # Custom source {{ .name | quote }}.
  - apiGroups: [{{ .apiGroup | default "" | quote }}]
    resources: [{{ .resource | quote }}]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- if .Values.workloads.enabled }}
  - apiGroups: [""]
    resources: [services]
    verbs: {{ toJson $read }}
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: {{ toJson $read }}
  {{- end }}
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "startpunkt.clusterName" . }}
  labels:
    {{- include "startpunkt.commonLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "startpunkt.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "startpunkt.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.customResources.enabled }}
---
# The settings: read in the release's own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "startpunkt.fullname" . }}-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "startpunkt.commonLabels" . | nindent 4 }}
rules:
  - apiGroups: [startpunkt.ullberg.us]
    resources: [startpunkts, remotes]
    verbs: [get, list, watch]
  - apiGroups: [startpunkt.ullberg.us]
    resources: [startpunkts/status, remotes/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "startpunkt.fullname" . }}-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "startpunkt.commonLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "startpunkt.fullname" . }}-settings
subjects:
  - kind: ServiceAccount
    name: {{ include "startpunkt.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}

{{- if and .Values.rbac.create .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "startpunkt.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "startpunkt.commonLabels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ .Values.leaderElection.leaseName | default (include "startpunkt.fullname" .) | quote }}]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "startpunkt.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "startpunkt.commonLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "startpunkt.fullname" . }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "startpunkt.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
